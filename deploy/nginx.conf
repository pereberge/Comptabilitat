# Install only after issuing the certificate (see docs/desplegament.md).
server {
    listen 80;
    server_name comptabilitat.coopbellcaire.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://comptabilitat.coopbellcaire.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name comptabilitat.coopbellcaire.com;
    ssl_certificate /etc/letsencrypt/live/comptabilitat.coopbellcaire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comptabilitat.coopbellcaire.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    # The ordinary application user does not require a password.
    auth_basic "Comptabilitat";
    auth_basic_user_file /etc/nginx/comptabilitat.htpasswd;

    # Integration API has its own Bearer authentication; do not strip its token.
    location ^~ /api/v1/integrations/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
        proxy_read_timeout 300s;
    }
}
